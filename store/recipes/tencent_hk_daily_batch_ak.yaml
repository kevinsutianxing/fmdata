category: overseas
description: 腾讯直连港股日线批量(00700/02800/09618,不复权,中文列+code列; 2026-11-07 为补齐 GVRM 页面缺口建)
fetch:
  command: python3 -c 'import akshare as ak,pandas as pd; fs=[ak.stock_hk_hist(symbol=s,period="daily",adjust="",start_date=t).assign(code=s+".HK")
