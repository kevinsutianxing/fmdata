category: overseas
description: 腾讯直连港股日线批量(00700/02800/09618,不复权,中文列+code列; 2026-11-07 为补齐 GVRM 页面缺口建)
  | 🔴2026-11-16修正:stock_hk_hist(东财,拒HK43 IP)→stock_hk_daily(腾讯ifzq)
fetch:
  command: python3 -c 'import akshare as ak,pandas as pd; fs=[ak.stock_hk_daily(symbol=s,
    adjust="").rename(columns={"date":"日期","open":"开盘","high":"最高","low":"最低","close":"收盘","volume":"成交量","amount":"成交额"}).assign(code=s+".HK")
    for s in ("00700","02800","09618")]; pd.concat(fs).to_csv("/dev/stdout", index=False)'
  date_col: 日期
  host: hk43
  parser: csv
file: overseas/tencent_hk_daily_batch_ak.csv
name: tencent_hk_daily_batch_ak
source: remote
